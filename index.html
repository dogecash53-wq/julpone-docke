<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JULPONE NETWORK | PORTAL SYSTEM</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #e84118;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #2ed573;
            --border: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 71, 87, 0.15) 0%, transparent 40%), 
                              radial-gradient(circle at 80% 70%, rgba(46, 213, 115, 0.1) 0%, transparent 40%);
        }

        .portal-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Banner Design */
        .portal-banner {
            background: linear-gradient(135deg, var(--primary) 0%, #c23616 100%);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            border-bottom: 3px solid var(--accent);
        }

        .portal-banner h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .portal-banner p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* System Info Badges like Piso Wifi */
        .portal-status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .status-badge span {
            display: block;
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .status-badge strong {
            font-size: 13px;
            color: var(--accent);
            display: block;
            margin-top: 2px;
        }

        .portal-body {
            padding: 20px;
        }

        /* Form Controls Styled as Portal Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group label i {
            margin-right: 5px;
            color: var(--primary);
        }

        .portal-input, .portal-select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .portal-input:focus, .portal-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.2);
        }

        /* Mode Selection Tabs/Buttons */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .radio-tile {
            position: relative;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 600;
        }

        .radio-tile input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-tile:hover {
            border-color: rgba(255, 71, 87, 0.5);
        }

        .radio-tile.active {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Transport Mode Multi-Grid */
        .transport-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .transport-tile {
            position: relative;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .transport-tile input {
            position: absolute;
            opacity: 0;
        }

        .transport-tile.active {
            background: rgba(46, 213, 115, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Portal Main Button */
        .btn-portal-connect {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #c23616 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-portal-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
        }

        /* Monitor / Traffic Output Card */
        .monitor-panel {
            background: #161616;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            border: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .monitor-item i {
            margin-right: 4px;
        }
        .monitor-down { color: #00a8ff; }
        .monitor-up { color: #ff9f43; }
        .monitor-ping { color: var(--accent); }

        /* Output Box Voucher Style */
        .config-output-container {
            margin-top: 20px;
            background: #0a0a0a;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            position: relative;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .config-header span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .btn-copy {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-copy:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .config-textarea {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: monospace;
            font-size: 11px;
            resize: none;
            outline: none;
            word-break: break-all;
        }

        .portal-footer {
            text-align: center;
            padding: 15px;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <!-- Banner Header katulad ng LPB Piso Wifi Portal -->
    <div class="portal-banner">
        <h1>JULPONE NETWORK</h1>
        <p>JP Config & Login Portal Center</p>
    </div>

    <!-- Status Bar Counters -->
    <div class="portal-status-grid">
        <div class="status-badge">
            <span>Uptime</span>
            <strong id="stat-uptime">00:00:00</strong>
        </div>
        <div class="status-badge">
            <span>Active Nodes</span>
            <strong>12 / 12</strong>
        </div>
        <div class="status-badge">
            <span>Server Status</span>
            <strong style="color:var(--accent);">ONLINE</strong>
        </div>
    </div>

    <div class="portal-body">
        <!-- 1. Server Address Selection -->
        <div class="form-group">
            <label><i class="fa-solid fa-server"></i> Server Address</label>
